# =============================================================================
# CI Validation Pipeline — Pull Request Checks
# =============================================================================
# Triggers on PRs to main. Gates:
#   1. Python unit tests (pytest)
#   2. Code quality (ruff linting)
#   3. SAST vulnerability scan (trivy — 0 critical gate)
#   4. DAB bundle validation (both targets)
#   5. Terraform validation (syntax + provider schema)
#   6. Secrets scan (gitleaks — block hardcoded credentials)
# =============================================================================

name: CI — Validate & Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'databricks/**'
      - 'terraform/**'
      - '.github/workflows/**'

permissions:
  contents: read
  security-events: write  # For SAST results upload

jobs:
  # =========================================================================
  # Job 1: Python Code Quality & Unit Tests
  # =========================================================================
  code_quality:
    name: "🧪 Code Quality & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databricks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install pytest ruff

      - name: Run Ruff Linter
        run: ruff check src/ tests/ --output-format=github

      - name: Run Unit Tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: databricks/test-results.xml

  # =========================================================================
  # Job 2: SAST Vulnerability Scan (PCI-DSS Req 6.5)
  # =========================================================================
  sast_scan:
    name: "🔒 SAST Vulnerability Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # GATE: Fail on critical vulnerabilities
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =========================================================================
  # Job 3: Secrets Detection (SOC 2 — No hardcoded credentials)
  # =========================================================================
  secrets_scan:
    name: "🔑 Secrets Detection"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Job 4: Databricks Bundle Validation
  # =========================================================================
  bundle_validate:
    name: "📦 DAB Bundle Validation"
    runs-on: ubuntu-latest
    needs: [code_quality]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1

      - name: Validate AWS Production Bundle
        working-directory: databricks
        run: databricks bundle validate -t aws_production

      - name: Validate Azure DR Bundle
        working-directory: databricks
        run: databricks bundle validate -t azure_dr_standby

  # =========================================================================
  # Job 5: Terraform Validation
  # =========================================================================
  terraform_validate:
    name: "🏗️ Terraform Validation"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [production, dr-standby]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init (No Backend)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive
