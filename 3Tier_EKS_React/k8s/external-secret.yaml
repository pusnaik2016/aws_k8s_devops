# =============================================================================
# ExternalSecret — Pulls DB credentials from AWS Secrets Manager at runtime
# Author: Pushparaj Naik
# Security: No secrets stored in Git — auto-synced from AWS Secrets Manager
#
# REPLACES: secrets.yaml (deprecated — base64 secrets are insecure)
#
# Prerequisites:
#   1. External Secrets Operator installed (via Terraform: external_secrets.tf)
#   2. ClusterSecretStore "aws-secrets-manager" exists
#   3. AWS Secrets Manager secret exists at: db/<prefix>-<env>-db
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: 3-tier-app-eks
  labels:
    app.kubernetes.io/managed-by: pushparaj
    app.kubernetes.io/part-of: devops-quiz
spec:
  refreshInterval: 1h  # Re-sync from Secrets Manager every hour

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: app-secrets         # Creates a K8s Secret with this name
    creationPolicy: Owner     # ESO owns and manages this Secret lifecycle
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: devops-quiz

  data:
    # --- Database connection string ---
    - secretKey: DATABASE_URL
      remoteRef:
        key: db/pushparaj-dev-db      # AWS Secrets Manager secret name
        property: connection_string    # JSON key within the secret

    # --- Individual DB fields for init containers ---
    - secretKey: DB_HOST
      remoteRef:
        key: db/pushparaj-dev-db
        property: host

    - secretKey: DB_PORT
      remoteRef:
        key: db/pushparaj-dev-db
        property: port

    - secretKey: DB_USER
      remoteRef:
        key: db/pushparaj-dev-db
        property: username

    - secretKey: DB_PASSWORD
      remoteRef:
        key: db/pushparaj-dev-db
        property: password

    # --- Application secret key (stored separately) ---
    # NOTE: Create this secret in AWS Secrets Manager:
    #   aws secretsmanager create-secret --name pushparaj-dev-app-secret-key \
    #     --secret-string '{"secret_key":"<your-flask-secret-key>"}'
    - secretKey: SECRET_KEY
      remoteRef:
        key: pushparaj-dev-app-secret-key
        property: secret_key
