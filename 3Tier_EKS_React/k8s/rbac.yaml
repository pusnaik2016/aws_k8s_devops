# RBAC Configuration | Author: Pushparaj Naik
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: 3-tier-app-eks
  labels:
    app.kubernetes.io/managed-by: pushparaj
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: 3-tier-app-eks
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-role-binding
  namespace: 3-tier-app-eks
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: 3-tier-app-eks
roleRef:
  kind: Role
  name: app-role
  apiGroup: rbac.authorization.k8s.io
