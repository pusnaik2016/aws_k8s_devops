##############################################################################
# Dependabot — Keeps GitHub Actions and Python deps current
#
# Workflows covered by GitHub Actions updates:
#   .github/workflows/terraform-pr.yml         (Quality, Security & Plan)
#   .github/workflows/terraform-apply.yml      (Apply on merge)
#   .github/workflows/terraform-destroy.yml    (Manual destroy)
#   .github/workflows/terraform-drift.yml      (Daily drift detection)
#   .github/workflows/lambda-tests.yml         (Python unit tests)
##############################################################################

version: 2

updates:
  ##########################################################################
  # GitHub Actions — update all action @versions automatically
  ##########################################################################
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5

  ##########################################################################
  # pip — Python test dependencies (requirements-test.txt)
  ##########################################################################
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Keep boto3/botocore aligned with Lambda Python 3.12 runtime
      - dependency-name: "boto3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "botocore"
        update-types: ["version-update:semver-major"]
