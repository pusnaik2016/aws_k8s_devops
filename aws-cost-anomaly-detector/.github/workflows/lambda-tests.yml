##############################################################################
# Workflow: Lambda Unit Tests
# Triggers: PRs touching Python Lambda files
# Steps: pytest with coverage → coverage report as PR comment
##############################################################################

name: "Lambda Unit Tests"

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "modules/cost_analyzer/lambda/**.py"
      - "tests/**.py"
      - ".github/workflows/lambda-tests.yml"
      - "requirements-test.txt"

  push:
    branches:
      - main
      - master
    paths:
      - "modules/cost_analyzer/lambda/**.py"
      - "tests/**.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: "Python ${{ matrix.python-version }} Tests"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pytest with coverage
        id: pytest
        run: |
          python -m pytest tests/ \
            --cov=modules/cost_analyzer/lambda \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70 \
            --tb=short \
            -v \
            --junitxml=test-results.xml \
            2>&1 | tee pytest_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post test results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('pytest_output.txt', 'utf8');
            const exitCode = '${{ steps.pytest.outputs.exitcode }}';
            const icon = exitCode === '0' ? '✅' : '❌';
            const label = exitCode === '0' ? 'All tests passed' : 'Tests FAILED';

            // Truncate to avoid GitHub comment limits
            const truncated = output.length > 8000
              ? output.substring(0, 8000) + '\n... (truncated)'
              : output;

            const body = `## ${icon} Lambda Tests — ${label}

            <details>
            <summary>📋 Click to expand test output (Python ${{ matrix.python-version }})</summary>

            \`\`\`
            ${truncated}
            \`\`\`
            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Lambda Tests')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            test-results.xml
          retention-days: 14

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          comment_mode: always
          check_name: "Lambda Test Results (Python ${{ matrix.python-version }})"

      - name: Fail if tests failed
        if: steps.pytest.outputs.exitcode != '0'
        run: exit 1
