apiVersion: v1
kind: Service
metadata:
  name: audit-pipeline
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "audit-pipeline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "audit-pipeline.selectorLabels" . | nindent 4 }}
