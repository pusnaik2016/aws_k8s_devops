apiVersion: v1
kind: Service
metadata:
  name: clearing-engine-core
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "clearing-engine-core.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "clearing-engine-core.selectorLabels" . | nindent 4 }}
