# ─────────────────────────────────────────────────────────────────────────────
# MedCloud — Scheduled Security & Compliance Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Runs nightly DAST, weekly compliance audits, and container drift detection.
# ─────────────────────────────────────────────────────────────────────────────
name: "🛡️ MedCloud — Security & Compliance"

on:
  schedule:
    - cron: "0 2 * * *"     # Nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      scan_type:
        description: "Scan type"
        required: true
        default: "full"
        type: choice
        options: [full, containers-only, compliance-only, dast-only]

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  TRIVY_VERSION: "0.52.0"

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Container Image Drift Scan (detect new CVEs in deployed images)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  container-scan:
    name: "🐳 Container Drift Scan"
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type != 'compliance-only' && github.event.inputs.scan_type != 'dast-only'
    strategy:
      matrix:
        include:
          - service: storefront-api
            registry: ecr
            cloud: aws
          - service: order-service
            registry: ecr
            cloud: aws
          - service: notification-service
            registry: ecr
            cloud: aws
          - service: patient-service
            registry: acr
            cloud: azure
          - service: imaging-service
            registry: acr
            cloud: azure
          - service: ai-gateway
            registry: gar
            cloud: gcp
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        if: matrix.registry == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: ECR Login
        if: matrix.registry == 'ecr'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy Scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "image"
          image-ref: "${{ secrets[format('{0}_REGISTRY', matrix.cloud)] }}/medcloud/${{ matrix.service }}:latest"
          format: "table,sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "nightly-${{ matrix.service }}"
        continue-on-error: true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Infrastructure Compliance Audit
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  compliance-audit:
    name: "📋 Compliance Audit"
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type != 'containers-only' && github.event.inputs.scan_type != 'dast-only'

    steps:
      - uses: actions/checkout@v4

      - name: Checkov Full Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          check: |
            CKV_AWS_145,CKV_AWS_162,CKV_AWS_18,CKV_AWS_19,
            CKV_AZURE_1,CKV_AZURE_35,CKV_AZURE_42,
            CKV_GCP_12,CKV_GCP_18,CKV_GCP_7
          output_format: cli,junitxml
          output_file_path: console,checkov-results.xml

      - name: tfsec Audit
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          format: lovely,sarif
          out: tfsec-audit.sarif

      - name: Publish Compliance Report
        if: always()
        run: |
          echo "## 📋 Nightly Compliance Report — $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov (HIPAA/PCI) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec (Terraform) | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Drift | ✅ Completed |" >> $GITHUB_STEP_SUMMARY

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DAST — Dynamic Application Security Testing
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  dast-scan:
    name: "🕷️ DAST Scan"
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'dast-only'

    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "https://api-dev.medcloud.example.com"
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-a"
          issue_title: "ZAP DAST Scan Report"
          fail_action: false

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Notify on failures
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  notify:
    name: "📢 Notify"
    runs-on: ubuntu-latest
    needs: [container-scan, compliance-audit]
    if: failure()
    steps:
      - name: Slack Alert — Security Findings
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#medcloud-security'
          text: |
            🚨 *Nightly Security Scan Failed*
            Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SECURITY }}
