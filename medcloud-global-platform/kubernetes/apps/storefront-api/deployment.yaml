# ─────────────────────────────────────────────────────────────────────────────
# Storefront API — E-Commerce Backend (Deployed on AWS EKS)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: medcloud
  labels:
    istio-injection: enabled
    compliance: hipaa-pci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront-api
  namespace: medcloud
  annotations:
    # AWS IRSA — bind to IAM role for Aurora, DynamoDB, S3 access
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/medcloud-storefront-api-role
  labels:
    app: storefront-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
  namespace: medcloud
  labels:
    app: storefront-api
    version: v1
    cloud: aws
    compliance: pci-dss
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storefront-api
      version: v1
  template:
    metadata:
      labels:
        app: storefront-api
        version: v1
        cloud: aws
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: storefront-api
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "e-commerce"
          effect: "NoSchedule"
      nodeSelector:
        role: application
        cloud: aws

      # HIPAA: Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: storefront-api
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/medcloud/storefront-api:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: aurora-credentials
                  key: endpoint
            - name: DB_NAME
              value: "medcloud"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: endpoint
            - name: DYNAMODB_SESSION_TABLE
              value: "medcloud-prod-user-sessions"
            - name: DYNAMODB_CART_TABLE
              value: "medcloud-prod-shopping-cart"
            # Cross-cloud service URLs (via Istio mesh)
            - name: PATIENT_SERVICE_URL
              value: "http://patient-service.medcloud.svc.cluster.local:8080"
            - name: AI_GATEWAY_URL
              value: "http://ai-gateway.medcloud.svc.cluster.local:8080"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # Health checks
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

          # Security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Pod disruption budget for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: storefront-api

---
apiVersion: v1
kind: Service
metadata:
  name: storefront-api
  namespace: medcloud
  labels:
    app: storefront-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: storefront-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront-api
  namespace: medcloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront-api
  namespace: medcloud
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: storefront-api
