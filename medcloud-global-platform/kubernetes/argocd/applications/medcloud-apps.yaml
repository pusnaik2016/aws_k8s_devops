# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD Application Definitions — GitOps Deployment
# ─────────────────────────────────────────────────────────────────────────────

# ArgoCD Project for MedCloud
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: medcloud
  namespace: argocd
spec:
  description: "MedCloud Global Healthcare Platform"
  sourceRepos:
    - "https://github.com/ORG/medcloud-global-platform.git"
  destinations:
    - namespace: medcloud
      server: "https://kubernetes.default.svc"
    - namespace: istio-system
      server: "https://kubernetes.default.svc"
    - namespace: observability
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  roles:
    - name: deployer
      description: "Automated deployment role"
      policies:
        - p, proj:medcloud:deployer, applications, sync, medcloud/*, allow
        - p, proj:medcloud:deployer, applications, get, medcloud/*, allow
      groups:
        - medcloud-cicd

---
# Application: Storefront API (AWS EKS)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: medcloud
    cloud: aws
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: medcloud-deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: medcloud-alerts
spec:
  project: medcloud
  source:
    repoURL: "https://github.com/ORG/medcloud-global-platform.git"
    targetRevision: HEAD
    path: kubernetes/apps/storefront-api
  destination:
    server: "https://kubernetes.default.svc"
    namespace: medcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

