# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes Namespaces — MedCloud Platform
# ─────────────────────────────────────────────────────────────────────────────

# Application namespace
apiVersion: v1
kind: Namespace
metadata:
  name: medcloud
  labels:
    name: medcloud
    istio-injection: enabled
    compliance: hipaa-pci-dss
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    scheduler.alpha.kubernetes.io/defaultTolerations: "[]"
---
# Observability namespace (Prometheus, Grafana, Jaeger)
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    name: observability
    istio-injection: enabled
    purpose: monitoring
---
# Data pipeline namespace (cross-cloud data processors)
apiVersion: v1
kind: Namespace
metadata:
  name: data-pipeline
  labels:
    name: data-pipeline
    istio-injection: enabled
    compliance: hipaa
---
# Resource Quotas for medcloud namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: medcloud-quota
  namespace: medcloud
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "100"
    services: "20"
    persistentvolumeclaims: "20"
---
# Limit Range for medcloud namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: medcloud-limits
  namespace: medcloud
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: "50m"
        memory: 64Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
