# ─────────────────────────────────────────────────────────────────────────────
# RBAC — Role-Based Access Control for MedCloud Platform
# ─────────────────────────────────────────────────────────────────────────────

# Cluster Role: Read-only for platform observers
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: medcloud-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

---
# Cluster Role: Developer (deploy to non-prod)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: medcloud-developer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

---
# Cluster Role: SRE/Platform (full access with restrictions)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: medcloud-sre
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
# Role Binding: Observer for audit team (medcloud namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-team-observer
  namespace: medcloud
subjects:
  - kind: Group
    name: medcloud-audit-team
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: medcloud-observer
  apiGroup: rbac.authorization.k8s.io

---
# Role Binding: Developers for dev namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-team-developer
  namespace: medcloud
subjects:
  - kind: Group
    name: medcloud-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: medcloud-developer
  apiGroup: rbac.authorization.k8s.io

---
# Cluster Role Binding: SRE team
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-team-binding
subjects:
  - kind: Group
    name: medcloud-sre-team
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: medcloud-sre
  apiGroup: rbac.authorization.k8s.io
