# ==============================================================================
# Default Helm Values — Java Ecommerce Application
# ==============================================================================

replicaCount: 3

image:
  repository: ""  # Set via CI/CD: <account-id>.dkr.ecr.<region>.amazonaws.com/eks-devsecops/ecommerce-app
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: "ecommerce-app"
fullnameOverride: "ecommerce-app"

serviceAccount:
  create: true
  name: "ecommerce-app"
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/ecommerce-app-irsa

# --- Container Configuration ---
containerPort: 8080

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1024Mi"

# --- Health Checks ---
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

# --- Service ---
service:
  type: ClusterIP
  port: 8080

# --- Ingress (ALB) ---
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix

# --- HPA ---
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120

# --- PDB ---
podDisruptionBudget:
  enabled: true
  minAvailable: "50%"

# --- Topology Spread ---
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: ecommerce-app

# --- Security Context ---
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# --- Environment Variables ---
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_OPTS
    value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
  - name: SERVER_PORT
    value: "8080"

# --- ConfigMap data ---
config:
  DB_PORT: "3306"
  DB_NAME: "ecommercedb"
  LOGGING_LEVEL: "INFO"

# --- Node Selector ---
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - ecommerce-app
          topologyKey: kubernetes.io/hostname
