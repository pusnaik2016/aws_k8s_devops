# ==============================================================================
# Spring Boot Application Configuration
# ==============================================================================
# This file configures the Spring Boot application runtime settings.
# Values can be overridden at runtime via environment variables or
# Kubernetes ConfigMaps/Secrets.
#
# Naming convention for environment variable override:
#   app.name → APP_NAME
#   server.port → SERVER_PORT
# ==============================================================================

# --- Server Configuration ---
# Port that the embedded Tomcat server listens on.
# Must match the containerPort in Kubernetes deployment.yaml
server.port=8080

# --- Application Metadata ---
# These values are injected into the HealthController endpoints
# and can be overridden via Kubernetes environment variables.
app.name=boardgame-app
app.version=1.0.0
app.environment=development

# --- Actuator Configuration ---
# Expose health and info endpoints for Kubernetes probes.
# The /actuator/health endpoint is used by K8s liveness/readiness probes.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Logging Configuration ---
# Set log levels for the application and Spring framework.
logging.level.root=INFO
logging.level.com.devsecops.boardgame=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
