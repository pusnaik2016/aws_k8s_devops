# ==============================================================================
# GitHub Actions — CI Pipeline (Continuous Integration)
# ==============================================================================
# Triggered on every push to the main branch. Performs the full DevSecOps
# CI pipeline for the Netflix Clone React application:
#
#   1.  Checkout source code from GitHub
#   2.  Secrets scan — Gitleaks (PCI DSS Req 3)
#   3.  Set up Node.js 18 + npm cache for fast builds
#   4.  Install dependencies (npm ci)
#   5.  SAST — SonarCloud analysis (static security + quality)
#   6.  SCA — npm audit (CVE scanning of npm dependencies)
#   7.  Build React application (npm run build)
#   8.  Build Docker container image (multi-stage Nginx)
#   9.  Trivy — Scan Docker image for OS/package vulnerabilities
#   10. Push image to Amazon ECR (keyless via GitHub OIDC → AWS IAM)
#   11. Trigger CD workflow to update Kubernetes manifests
#
# Authentication:
#   AWS credentials are obtained via OIDC federation — GitHub Actions
#   exchanges its JWT token for temporary AWS credentials. No long-lived
#   AWS access keys are stored in GitHub Secrets.
#
# Required GitHub Secrets:
#   AWS_ACCOUNT_ID      — AWS account ID for ECR repository URL
#   SONAR_TOKEN         — SonarCloud authentication token
#   SONAR_ORGANIZATION  — SonarCloud organization key
#   TMDB_API_KEY        — The Movie Database API key (build-time)
#
# Required GitHub Variables:
#   AWS_REGION          — AWS region (default: us-east-1)
# ==============================================================================

name: CI Pipeline — DevSecOps

# =============================================================================
# Trigger: Run on pushes to main branch and pull requests
# =============================================================================
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'k8s-manifests/**'     # Don't re-run CI when manifests change (CD handles that)
  pull_request:
    branches: [main]

# =============================================================================
# Permissions: Minimal permissions required for OIDC + PR status
# =============================================================================
permissions:
  id-token: write       # Required for GitHub OIDC → AWS IAM role assumption
  contents: read        # Required for actions/checkout
  security-events: write # Required for uploading Trivy SARIF results

# =============================================================================
# Environment Variables — Centralized pipeline configuration
# =============================================================================
env:
  NODE_VERSION: '18'
  APP_DIR: 'app'
  ECR_REPOSITORY: 'netflix-devsecops/netflix-clone'
  IMAGE_TAG: ${{ github.sha }}   # Use commit SHA for immutable, traceable tags

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ===========================================================================
  # Job 1: Build, Test, and Scan
  # ===========================================================================
  ci:
    name: Build → Test → Scan → Push
    runs-on: ubuntu-latest
    # Only push images from main branch (PRs only build and test)
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      # -----------------------------------------------------------------------
      # Step 1: Checkout source code
      # -----------------------------------------------------------------------
      - name: "🔄 Checkout source code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history required for SonarCloud blame data

      # -----------------------------------------------------------------------
      # Step 2: Secrets scan — PCI DSS Req 3 / SOC 2 CC6
      # -----------------------------------------------------------------------
      # Scans the entire git history for accidentally committed secrets:
      # AWS keys, tokens, passwords, private keys, connection strings.
      # Runs before any build step so a leaked secret fails fast.
      # -----------------------------------------------------------------------
      - name: "🔑 Gitleaks — Secrets scan"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Step 3: Set up Node.js 18 + npm cache
      # -----------------------------------------------------------------------
      # Caching npm dependencies speeds up builds by ~50% on subsequent runs.
      # -----------------------------------------------------------------------
      - name: "📦 Set up Node.js 18 + npm cache"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      # -----------------------------------------------------------------------
      # Step 4: Install dependencies
      # -----------------------------------------------------------------------
      # npm ci performs a clean install from package-lock.json for reproducible
      # builds. This is faster and more reliable than npm install.
      # -----------------------------------------------------------------------
      - name: "📥 Install dependencies"
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # -----------------------------------------------------------------------
      # Step 5: SAST — SonarCloud Analysis
      # -----------------------------------------------------------------------
      # SonarCloud performs Static Application Security Testing:
      #   - Security vulnerabilities (XSS, injection, SSRF, etc.)
      #   - Code bugs (null references, resource leaks)
      #   - Code smells (complexity, duplication)
      #
      # SonarCloud is free for public repos and replaces self-hosted SonarQube.
      # -----------------------------------------------------------------------
      - name: "🔍 SAST — SonarCloud analysis"
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ${{ env.APP_DIR }}
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'netflix-clone' }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/*.test.js,**/*.spec.js,**/node_modules/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Step 6: SCA — npm audit (Dependency vulnerability scanning)
      # -----------------------------------------------------------------------
      # Scans all npm dependencies (transitive included) against known CVE
      # databases. Replaces OWASP Dependency-Check used in Java projects.
      # -----------------------------------------------------------------------
      - name: "🛡️ SCA — npm audit (dependency vulnerabilities)"
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "📋 Running npm audit..."
          npm audit --audit-level=high --production || true

          echo ""
          echo "📋 Dependency tree summary:"
          npm ls --depth=0 2>/dev/null || true

      # -----------------------------------------------------------------------
      # Step 7: Build React application
      # -----------------------------------------------------------------------
      # Builds the production-optimized React bundle with the TMDB API key
      # injected as a build-time environment variable.
      # -----------------------------------------------------------------------
      - name: "🏗️ Build React application"
        working-directory: ${{ env.APP_DIR }}
        env:
          REACT_APP_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CI: false   # Don't treat warnings as errors
        run: npm run build

      # -----------------------------------------------------------------------
      # Step 8: Set image metadata
      # -----------------------------------------------------------------------
      - name: "🏷️ Set image metadata"
        id: meta
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image will be tagged as: ${IMAGE_TAG}"

      # -----------------------------------------------------------------------
      # Step 9: Build Docker image
      # -----------------------------------------------------------------------
      # Uses the multi-stage Dockerfile to build a minimal Nginx container.
      # The React build from Step 7 is already in app/build/, but the
      # Dockerfile rebuilds it to ensure the image is self-contained.
      # -----------------------------------------------------------------------
      - name: "🐳 Build Docker image"
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker build \
            --build-arg TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            -t ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
            -t ${{ env.ECR_REPOSITORY }}:latest \
            .

      # -----------------------------------------------------------------------
      # Step 10: Trivy — Container image vulnerability scan
      # -----------------------------------------------------------------------
      # Scans the Docker image for OS package and application dependency
      # vulnerabilities. Results are uploaded as SARIF to GitHub Security tab.
      # -----------------------------------------------------------------------
      - name: "🔒 Trivy — Scan Docker image"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}"
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'     # Set to '1' to fail on vulnerabilities

      - name: "📤 Upload Trivy scan to GitHub Security"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # -----------------------------------------------------------------------
      # Step 11: Push to Amazon ECR (keyless via GitHub OIDC)
      # -----------------------------------------------------------------------
      # Authenticates to AWS using OIDC federation (no stored credentials).
      # Only runs on main branch (not PRs).
      # -----------------------------------------------------------------------
      - name: "🔑 Configure AWS credentials (OIDC)"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/netflix-devsecops-github-actions-ecr-role
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: "🔐 Login to Amazon ECR"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: "🚀 Push image to ECR"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"

          # Tag for ECR
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
            ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker tag ${{ env.ECR_REPOSITORY }}:latest \
            ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest

          # Push both tags
          docker push ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker push ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest

          echo "✅ Image pushed: ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}"

      # -----------------------------------------------------------------------
      # Step 12: Trigger CD workflow
      # -----------------------------------------------------------------------
      - name: "🔄 Trigger CD workflow"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: deploy
          client-payload: '{"image_tag": "${{ steps.meta.outputs.image_tag }}"}'

  # ============================================================================
  # Job 2: DORA Metrics — Track Lead Time for Changes
  # ============================================================================
  dora-metrics:
    name: 📊 DORA - Record CI Metrics
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Record deployment and lead time
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                auto_merge: false,
                required_contexts: [],
                description: `Deployment triggered by ${context.actor}`,
                transient_environment: false,
                production_environment: true
              });

              const commitData = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha
              });

              const commitTime = new Date(commitData.data.commit.committer.date);
              const now = new Date();
              const leadTimeMinutes = Math.round((now - commitTime) / 60000);

              core.summary
                .addHeading('📊 DORA Metrics', 3)
                .addTable([
                  [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                  ['Lead Time for Changes', `${leadTimeMinutes} minutes`],
                  ['Commit SHA', context.sha.substring(0, 7)],
                  ['Commit Time', commitTime.toISOString()],
                  ['Deploy Time', now.toISOString()]
                ])
                .write();

              console.log(`📊 DORA Lead Time for Changes: ${leadTimeMinutes} minutes`);

              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                description: `Lead time: ${leadTimeMinutes}min`,
                environment: 'production'
              });
            } catch (error) {
              core.warning(`DORA metrics recording failed: ${error.message}`);
            }
