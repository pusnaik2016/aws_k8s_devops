[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "ebs-cost-optimizer"
version     = "1.0.0"
description = "Scan, tag, and clean up EBS volumes for AWS cost optimisation"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tabulate>=0.9",
]

[project.scripts]
ebs-optimizer = "ebs_optimizer:cli"

[tool.pytest.ini_options]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions= ["test_*"]
addopts         = "-v --tb=short"
filterwarnings  = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit   = ["*/dist/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 70

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
