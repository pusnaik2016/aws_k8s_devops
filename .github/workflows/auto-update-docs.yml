# ─────────────────────────────────────────────────────────────────────────────
# Auto-Update README & Generate PDF
#
# Triggers when:
#   1. A new project directory is added/removed
#   2. Any project's README.md is modified
#   3. The playbook markdown is modified
#   4. Manual trigger via workflow_dispatch
#
# What it does:
#   1. Scans all project directories
#   2. Updates the "Repository Structure" section in root README.md
#   3. Generates a PDF of the Enterprise Architect Playbook
#   4. Commits changes back to the repo
# ─────────────────────────────────────────────────────────────────────────────

name: Auto-Update README & Generate PDF

on:
  push:
    branches: [main, master]
    paths:
      - '**/README.md'
      - 'interview-prep-docs/**'
      - 'scripts/update_readme.py'
      # Trigger when directories are added/removed (any new file in a project dir)
      - '*/terraform/**'
      - '*/src/**'
      - '*/infra/**'
  workflow_dispatch:  # Manual trigger

# Prevent concurrent runs
concurrency:
  group: readme-update
  cancel-in-progress: true

permissions:
  contents: write  # Required to push commits back

jobs:
  update-docs:
    name: Update README & Generate PDF
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diffs
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Setup Python ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Install pandoc + LaTeX for PDF generation ──
      - name: Install pandoc & LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern

      # ── Run the auto-update script ──
      - name: Update README & Generate PDF
        run: |
          python3 scripts/update_readme.py --generate-pdf

      # ── Verify PDF was generated ──
      - name: Verify outputs
        run: |
          echo "=== Updated files ==="
          git diff --name-only
          echo ""
          echo "=== PDF files ==="
          find docs/pdf -name "*.pdf" -exec ls -lh {} \; 2>/dev/null || echo "No PDFs generated"

      # ── Commit & Push changes ──
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add updated files
          git add README.md docs/pdf/ || true

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "✅ No changes detected — nothing to commit"
          else
            PROJECTS_COUNT=$(find . -maxdepth 1 -mindepth 1 -type d ! -name ".*" ! -name "scripts" ! -name "docs" ! -name "node_modules" | wc -l | tr -d ' ')
            git commit -m "docs: auto-update README structure (${PROJECTS_COUNT} projects) & regenerate PDF [skip ci]"
            git push
            echo "✅ Changes committed and pushed"
          fi

      # ── Upload PDF as artifact (downloadable from Actions tab) ──
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-playbook-pdf
          path: docs/pdf/*.pdf
          retention-days: 90
          if-no-files-found: warn
