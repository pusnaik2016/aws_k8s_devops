# ─────────────────────────────────────────────────────────────────────────────
# MedCloud Global — Multi-Cloud Terraform CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Multi-stage pipeline with security scanning (tfsec, Checkov) and
# sequential cloud deployment with manual approval for production.
# ─────────────────────────────────────────────────────────────────────────────

name: "🏥 MedCloud — Infrastructure Pipeline"

on:
  push:
    branches: [main]
    paths:
      - 'medcloud-global-platform/terraform/**'
      - '.github/workflows/medcloud-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'medcloud-global-platform/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      cloud:
        description: 'Target cloud (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aws
          - azure
          - gcp

concurrency:
  group: medcloud-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: "medcloud-global-platform/terraform"

permissions:
  id-token: write    # OIDC for cloud auth
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 1: Security Scanning (tfsec + Checkov)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          format: sarif
          out: tfsec-results.sarif
          soft_fail: true

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          check: CKV_AWS_,CKV_AZURE_,CKV_GCP_
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true
          compact: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 2: Terraform Plan (per cloud)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  terraform-plan-aws:
    name: "☁️ AWS — Terraform Plan"
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'aws' || github.event.inputs.cloud == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (AWS Networking)
        working-directory: ${{ env.WORKING_DIR }}/aws/networking
        run: terraform init -input=false

      - name: Terraform Plan (AWS Networking)
        working-directory: ${{ env.WORKING_DIR }}/aws/networking
        run: terraform plan -input=false -out=tfplan-aws-networking
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-aws
          path: ${{ env.WORKING_DIR }}/aws/networking/tfplan-aws-networking

  terraform-plan-azure:
    name: "🔷 Azure — Terraform Plan"
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'azure' || github.event.inputs.cloud == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (Azure Networking)
        working-directory: ${{ env.WORKING_DIR }}/azure/networking
        run: terraform init -input=false

      - name: Terraform Plan (Azure Networking)
        working-directory: ${{ env.WORKING_DIR }}/azure/networking
        run: terraform plan -input=false -out=tfplan-azure-networking
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-azure
          path: ${{ env.WORKING_DIR }}/azure/networking/tfplan-azure-networking

  terraform-plan-gcp:
    name: "🌐 GCP — Terraform Plan"
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'gcp' || github.event.inputs.cloud == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GCP Auth (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (GCP Networking)
        working-directory: ${{ env.WORKING_DIR }}/gcp/networking
        run: terraform init -input=false

      - name: Terraform Plan (GCP Networking)
        working-directory: ${{ env.WORKING_DIR }}/gcp/networking
        run: terraform plan -input=false -out=tfplan-gcp-networking
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-gcp
          path: ${{ env.WORKING_DIR }}/gcp/networking/tfplan-gcp-networking

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 3: Terraform Apply (on merge to main only)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  terraform-apply:
    name: "🚀 Apply Infrastructure"
    runs-on: ubuntu-latest
    needs: [terraform-plan-aws, terraform-plan-azure, terraform-plan-gcp]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Plan Artifacts
        uses: actions/download-artifact@v4
        with:
          path: plans/

      - name: Apply Summary
        run: |
          echo "## 🏥 MedCloud Infrastructure Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud | Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| AWS | Networking | ✅ Planned |" >> $GITHUB_STEP_SUMMARY
          echo "| Azure | Networking | ✅ Planned |" >> $GITHUB_STEP_SUMMARY
          echo "| GCP | Networking | ✅ Planned |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** Apply step requires cloud credentials configured via OIDC." >> $GITHUB_STEP_SUMMARY
