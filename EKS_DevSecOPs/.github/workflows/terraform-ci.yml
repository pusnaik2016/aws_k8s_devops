# ==============================================================================
# GitHub Actions — Terraform IaC Pipeline
# ==============================================================================
# Validates, lints, scans, and applies Terraform infrastructure.
# Runs fmt, validate, tflint, Checkov, plan, and apply (on main merge).
# ==============================================================================

name: "🏗️ Terraform CI/CD"

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.9.0'
  AWS_PRIMARY_REGION: 'us-east-1'
  AWS_SECONDARY_REGION: 'ap-south-1'

jobs:
  # ==========================================================================
  # Job 1: Validate & Lint
  # ==========================================================================
  validate:
    name: "🔍 Validate & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "📐 Terraform Format Check"
        run: terraform fmt -check -recursive -diff
        working-directory: terraform

      - name: "✅ Terraform Validate (modules)"
        run: |
          for dir in modules/*/; do
            echo "--- Validating $dir ---"
            cd "$dir"
            terraform init -backend=false
            terraform validate
            cd ../..
          done
        working-directory: terraform

      - name: "🔎 TFLint"
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: "🔎 Run TFLint"
        run: |
          tflint --init
          tflint --recursive --force
        working-directory: terraform

  # ==========================================================================
  # Job 2: Security Scan
  # ==========================================================================
  security-scan:
    name: "🛡️ Checkov Security Scan"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "🛡️ Checkov Scan"
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true  # Don't block on warnings
          skip_check: CKV_AWS_144,CKV_AWS_145  # Skip cross-region checks (handled separately)

      - name: "📤 Upload Checkov SARIF"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # ==========================================================================
  # Job 3: Plan Primary Region
  # ==========================================================================
  plan-primary:
    name: "📋 Plan Primary (us-east-1)"
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    environment: planning
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "🔑 AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.TF_ROLE_NAME || 'terraform-github-actions' }}
          aws-region: ${{ env.AWS_PRIMARY_REGION }}

      - name: "🏗️ Terraform Init (Primary)"
        run: terraform init
        working-directory: terraform/environments/primary

      - name: "📋 Terraform Plan (Primary)"
        run: terraform plan -no-color -out=primary.tfplan
        working-directory: terraform/environments/primary

      - name: "💬 Post Plan to PR"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('cd terraform/environments/primary && terraform show -no-color primary.tfplan').toString();
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Primary Region Plan (us-east-1)\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  # ==========================================================================
  # Job 4: Plan Secondary Region
  # ==========================================================================
  plan-secondary:
    name: "📋 Plan Secondary (ap-south-1)"
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    environment: planning
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "🔑 AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.TF_ROLE_NAME || 'terraform-github-actions' }}
          aws-region: ${{ env.AWS_SECONDARY_REGION }}

      - name: "🏗️ Terraform Init (Secondary)"
        run: terraform init
        working-directory: terraform/environments/secondary

      - name: "📋 Terraform Plan (Secondary)"
        run: terraform plan -no-color -out=secondary.tfplan
        working-directory: terraform/environments/secondary

  # ==========================================================================
  # Job 5: Apply (main branch only, requires approval)
  # ==========================================================================
  apply-primary:
    name: "🚀 Apply Primary (us-east-1)"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [plan-primary, plan-secondary]
    environment: production
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "🔑 AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.TF_ROLE_NAME || 'terraform-github-actions' }}
          aws-region: ${{ env.AWS_PRIMARY_REGION }}

      - name: "🏗️ Terraform Init & Apply (Primary)"
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: terraform/environments/primary

  apply-secondary:
    name: "🚀 Apply Secondary (ap-south-1)"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [apply-primary]
    environment: production
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "🔑 AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.TF_ROLE_NAME || 'terraform-github-actions' }}
          aws-region: ${{ env.AWS_SECONDARY_REGION }}

      - name: "🏗️ Terraform Init & Apply (Secondary)"
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: terraform/environments/secondary
