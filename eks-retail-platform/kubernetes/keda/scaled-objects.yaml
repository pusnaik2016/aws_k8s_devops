# ─────────────────────────────────────────────────────────────────────────────
# KEDA ScaledObjects — Event-Driven Autoscaling
# ─────────────────────────────────────────────────────────────────────────────
# KEDA for complex event-driven workloads (SQS triggers)
# Per reference article: Use KEDA when trigger source is a message queue
# ─────────────────────────────────────────────────────────────────────────────

# order-service: Scale 0→20 based on SQS queue depth
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-service-scaler
  namespace: retail-apps
  labels:
    app: order-service
    scaling-strategy: keda
spec:
  scaleTargetRef:
    name: order-service
  minReplicaCount: 0                  # KEDA scale-to-zero
  maxReplicaCount: 20
  cooldownPeriod: 60
  pollingInterval: 15
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "${ORDER_QUEUE_URL}"
        queueLength: "5"              # 1 pod per 5 messages
        awsRegion: "us-east-1"
        identityOwner: operator       # KEDA operator IRSA handles auth
---
# notification-service: Scale 0→10 based on SQS queue depth
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaler
  namespace: retail-apps
  labels:
    app: notification-service
    scaling-strategy: keda
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 120
  pollingInterval: 30
  advanced:
    restoreToOriginalReplicaCount: false
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "${NOTIFICATION_QUEUE_URL}"
        queueLength: "10"
        awsRegion: "us-east-1"
        identityOwner: operator
---
# KEDA TriggerAuthentication (uses IRSA)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: retail-apps
spec:
  podIdentity:
    provider: aws
