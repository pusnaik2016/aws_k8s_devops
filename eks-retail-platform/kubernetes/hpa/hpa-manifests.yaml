# ─────────────────────────────────────────────────────────────────────────────
# Native HPA — K8s 1.36+ Scale-to-Zero
# ─────────────────────────────────────────────────────────────────────────────
# Per reference article: Use native HPA when trigger is simple external metric
# HPAScaleToZero feature gate (stable in K8s 1.36+)
# ─────────────────────────────────────────────────────────────────────────────

# storefront-api: Native HPA scale-to-zero on external metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront-api-hpa
  namespace: retail-apps
  labels:
    app: storefront-api
    scaling-strategy: native-hpa
  annotations:
    description: "Native K8s HPA with scale-to-zero (K8s 1.36+)"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront-api
  minReplicas: 0                      # Native scale-to-zero!
  maxReplicas: 15
  metrics:
    - type: External
      external:
        metric:
          name: http_requests_per_second
          selector:
            matchLabels:
              service: storefront-api
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
# inventory-service: Native HPA scale-to-zero on CPU + external metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service-hpa
  namespace: retail-apps
  labels:
    app: inventory-service
    scaling-strategy: native-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-service
  minReplicas: 0
  maxReplicas: 10
  metrics:
    - type: External
      external:
        metric:
          name: http_requests_per_second
          selector:
            matchLabels:
              service: inventory-service
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
---
# payment-service: Standard HPA (min 2 — NEVER scale to zero for PCI)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: payment
  labels:
    app: payment-service
    scaling-strategy: standard-hpa
  annotations:
    description: "PCI-DSS: Payment always-on, min 2 replicas"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2                      # PCI: always running
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # Conservative for payments
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
