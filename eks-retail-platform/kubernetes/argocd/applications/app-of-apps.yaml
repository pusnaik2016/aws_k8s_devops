# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD — App-of-Apps Pattern
# ─────────────────────────────────────────────────────────────────────────────
# Root Application manages all child applications
# Sync waves: base → infra → apps
# ─────────────────────────────────────────────────────────────────────────────

# Root App-of-Apps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eks-retail-platform.git
    targetRevision: main
    path: kubernetes/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
---
# ─── Child Applications ─────────────────────────────────────────────────────

# Wave 0: Base infrastructure (namespaces, RBAC, network policies)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base-infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eks-retail-platform.git
    targetRevision: main
    path: kubernetes/base
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 1: Karpenter NodePools
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eks-retail-platform.git
    targetRevision: main
    path: kubernetes/karpenter
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 2: Istio configuration
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eks-retail-platform.git
    targetRevision: main
    path: kubernetes/istio
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 3: KEDA ScaledObjects + HPA
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscaling-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/your-org/eks-retail-platform.git
      targetRevision: main
      path: kubernetes/keda
    - repoURL: https://github.com/your-org/eks-retail-platform.git
      targetRevision: main
      path: kubernetes/hpa
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 4: FluentBit
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluentbit-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eks-retail-platform.git
    targetRevision: main
    path: kubernetes/fluentbit
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 5: Application deployments
