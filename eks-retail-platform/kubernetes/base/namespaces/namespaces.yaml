# ─────────────────────────────────────────────────────────────────────────────
# Namespaces — Compliance-Aware Isolation
# ─────────────────────────────────────────────────────────────────────────────
# PCI-DSS Req 1.3: Network segmentation — payment namespace is isolated
# Pod Security Standards applied via labels
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: retail-apps
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: payment
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
    compliance: pci-dss
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    scheduler.alpha.kubernetes.io/node-selector: "compliance=pci-hipaa"
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: fluentbit
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
    pod-security.kubernetes.io/enforce: privileged # DaemonSet needs host access
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: eks-retail-platform
    pod-security.kubernetes.io/enforce: baseline
