# ─────────────────────────────────────────────────────────────
# CI Pipeline — Lint, Test, DevSecOps Scan
# ─────────────────────────────────────────────────────────────
# Security Gates:
#   1. Gitleaks       — Secret detection in code & git history
#   2. Hadolint       — Dockerfile best-practice linting
#   3. Trivy FS       — Vulnerability scan (source code + deps)
#   4. Checkov        — IaC misconfiguration scan (Terraform)
#   5. SonarCloud     — SAST, code smells, coverage analysis
#   6. pip-audit      — Python dependency vulnerability check
#   7. Ruff           — Python linting
#   8. pytest         — Unit tests with coverage
# ─────────────────────────────────────────────────────────────
name: CI — Lint, Test & DevSecOps Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write    # For SonarCloud PR decoration
  security-events: write  # For SARIF upload to GitHub Security tab

jobs:
  # ───────────────────────────────────────────────────────────
  # 1. Secret Detection — Gitleaks
  # ───────────────────────────────────────────────────────────
  gitleaks:
    name: 🔐 Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ───────────────────────────────────────────────────────────
  # 2. Dockerfile Linting — Hadolint
  # ───────────────────────────────────────────────────────────
  hadolint:
    name: 🐳 Hadolint — Dockerfile Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-service, analytics-service]
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/${{ matrix.service }}/Dockerfile
          failure-threshold: warning
          format: sarif
          output-file: hadolint-${{ matrix.service }}.sarif

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-${{ matrix.service }}.sarif
          category: hadolint-${{ matrix.service }}

  # ───────────────────────────────────────────────────────────
  # 3. Python Tests + Coverage
  # ───────────────────────────────────────────────────────────
  python-tests:
    name: 🐍 Python Tests & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-service, analytics-service]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/${{ matrix.service }}/requirements.txt

      - name: Install Dependencies
        run: |
          cd src/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (Ruff)
        run: |
          cd src/${{ matrix.service }}
          ruff check app/ tests/

      - name: Unit Tests with Coverage
        run: |
          cd src/${{ matrix.service }}
          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: src/${{ matrix.service }}/coverage.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: src/${{ matrix.service }}/test-results.xml

  # ───────────────────────────────────────────────────────────
  # 4. Python Dependency Audit — pip-audit
  # ───────────────────────────────────────────────────────────
  dependency-audit:
    name: 📦 pip-audit — Dependency Vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-service, analytics-service]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Dependencies
        run: |
          cd src/${{ matrix.service }}
          pip-audit -r requirements.txt --desc --fix --dry-run || true
          pip-audit -r requirements.txt --format json --output audit-${{ matrix.service }}.json || true

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.service }}
          path: src/${{ matrix.service }}/audit-${{ matrix.service }}.json

  # ───────────────────────────────────────────────────────────
  # 5. Terraform Validate + Format
  # ───────────────────────────────────────────────────────────
  terraform-validate:
    name: 🏗️ Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Validate (prod)
        run: |
          cd terraform/envs/prod
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate (staging)
        run: |
          cd terraform/envs/staging
          terraform init -backend=false
          terraform validate

  # ───────────────────────────────────────────────────────────
  # 6. Trivy — Filesystem Vulnerability Scan
  # ───────────────────────────────────────────────────────────
  trivy-fs-scan:
    name: 🔍 Trivy — Source & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan (Source Code)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: src/
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # ───────────────────────────────────────────────────────────
  # 7. Trivy — Docker Image Scan (Build + Scan, No Push)
  # ───────────────────────────────────────────────────────────
  trivy-image-scan:
    name: 🐳 Trivy — Container Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-service, analytics-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image (CI only — not pushed)
        run: |
          docker build \
            -t omnipresense-ai/${{ matrix.service }}:ci-scan \
            src/${{ matrix.service }}/

      - name: Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omnipresense-ai/${{ matrix.service }}:ci-scan
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Trivy Image Scan (Table Output for PR)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: omnipresense-ai/${{ matrix.service }}:ci-scan
          severity: CRITICAL,HIGH,MEDIUM
          format: table

  # ───────────────────────────────────────────────────────────
  # 8. Checkov — IaC Security Scan (Terraform)
  # ───────────────────────────────────────────────────────────
  checkov:
    name: 🛡️ Checkov — IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov-iac

  # ───────────────────────────────────────────────────────────
  # 9. SonarCloud — SAST & Code Quality
  # ───────────────────────────────────────────────────────────
  sonarcloud:
    name: 📊 SonarCloud — SAST & Code Quality
    runs-on: ubuntu-latest
    needs: [python-tests]  # Wait for coverage reports
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for blame data

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.sources=src/
            -Dsonar.tests=src/
            -Dsonar.test.inclusions=**/tests/**
            -Dsonar.python.coverage.reportPaths=coverage-chat-service/coverage.xml,coverage-analytics-service/coverage.xml
            -Dsonar.qualitygate.wait=true

  # ───────────────────────────────────────────────────────────
  # 10. Kubernetes Manifest Linting — kubeconform
  # ───────────────────────────────────────────────────────────
  k8s-lint:
    name: ☸️ Kubeconform — K8s Manifest Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate K8s Manifests
        run: |
          find k8s/base -name '*.yaml' -not -name 'kustomization.yaml' | \
            xargs kubeconform \
              -strict \
              -summary \
              -kubernetes-version 1.29.0 \
              -ignore-missing-schemas

  # ───────────────────────────────────────────────────────────
  # CI Gate — All checks must pass
  # ───────────────────────────────────────────────────────────
  ci-gate:
    name: ✅ CI Gate — All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - hadolint
      - python-tests
      - dependency-audit
      - terraform-validate
      - trivy-fs-scan
      - trivy-image-scan
      - checkov
      - sonarcloud
      - k8s-lint
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Gitleaks:       ${{ needs.gitleaks.result }}"
          echo "Hadolint:       ${{ needs.hadolint.result }}"
          echo "Python Tests:   ${{ needs.python-tests.result }}"
          echo "Dep Audit:      ${{ needs.dependency-audit.result }}"
          echo "Terraform:      ${{ needs.terraform-validate.result }}"
          echo "Trivy FS:       ${{ needs.trivy-fs-scan.result }}"
          echo "Trivy Image:    ${{ needs.trivy-image-scan.result }}"
          echo "Checkov:        ${{ needs.checkov.result }}"
          echo "SonarCloud:     ${{ needs.sonarcloud.result }}"
          echo "K8s Lint:       ${{ needs.k8s-lint.result }}"

          # Fail if any required job failed
          if [[ "${{ needs.gitleaks.result }}" == "failure" || \
                "${{ needs.python-tests.result }}" == "failure" || \
                "${{ needs.terraform-validate.result }}" == "failure" || \
                "${{ needs.trivy-image-scan.result }}" == "failure" ]]; then
            echo "❌ Required CI checks failed!"
            exit 1
          fi

          echo "✅ All CI checks passed!"
