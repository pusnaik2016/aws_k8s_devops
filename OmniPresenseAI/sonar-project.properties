# ─────────────────────────────────────────────────────────────
# SonarCloud Configuration — OmniPresenseAI
# ─────────────────────────────────────────────────────────────
sonar.projectKey=pusnaik2016_OmniPresenseAI
sonar.organization=pusnaik2016

sonar.sources=src/
sonar.tests=src/
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/migrations/**

# Python
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage-chat-service/coverage.xml,coverage-analytics-service/coverage.xml

# Quality Gate
sonar.qualitygate.wait=true
