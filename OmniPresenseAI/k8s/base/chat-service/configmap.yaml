apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-service-config
  namespace: omni-ai
data:
  CHAT_ENVIRONMENT: "production"
  CHAT_AWS_REGION: "us-east-1"
  CHAT_BEDROCK_MODEL_ID: "anthropic.claude-3-5-sonnet-20240620-v1:0"
  CHAT_BEDROCK_EMBEDDING_MODEL_ID: "amazon.titan-embed-text-v2:0"
  CHAT_DATABASE_PORT: "5432"
  CHAT_DATABASE_NAME: "omnipresense"
  CHAT_DATABASE_USER: "omniadmin"
  CHAT_REDIS_PORT: "6379"
  CHAT_REDIS_SSL: "true"
  CHAT_REDIS_CACHE_TTL: "3600"
  CHAT_RAG_TOP_K: "5"
