apiVersion: v1
kind: Namespace
metadata:
  name: omni-ai
  labels:
    app.kubernetes.io/part-of: omnipresense-ai
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: omni-ai-quota
  namespace: omni-ai
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
