# ============================================================================
# Imaging Service — Deployment + Service + HPA + PDB
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imaging-service-deployment
  namespace: healthcloud-apps
  labels:
    app: imaging-service
    version: v1
    compliance: hipaa
    database-access: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: imaging-service
  template:
    metadata:
      labels:
        app: imaging-service
        version: v1
        compliance: hipaa
        database-access: "true"
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: imaging-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: imaging-service
      containers:
        - name: imaging-service
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/healthcloud/imaging-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: imaging-service-config
                  key: s3-bucket
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: imaging-service-db-secret
                  key: host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: imaging-service-db-secret
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: imaging-service-svc
  namespace: healthcloud-apps
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: imaging-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: imaging-service-hpa
  namespace: healthcloud-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: imaging-service-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: imaging-service-pdb
  namespace: healthcloud-apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: imaging-service
