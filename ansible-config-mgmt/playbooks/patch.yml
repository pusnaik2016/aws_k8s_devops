# =============================================================================
# Playbook: patch.yml — OS Security Patching
# =============================================================================
# Applies security updates with optional reboot.
# Usage:
#   ansible-playbook -i inventories/<env>/hosts.ini playbooks/patch.yml \
#     --vault-password-file .vault-pass
#
# Patch specific group:
#   ansible-playbook ... --limit web
# =============================================================================
---
- name: Patch servers with security updates
  hosts: all
  become: yes
  gather_facts: yes
  serial: 1                    # Patch one host at a time to maintain availability

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
      tags: [patch]

    - name: Apply security updates only
      ansible.builtin.apt:
        upgrade: safe
      register: patch_result
      tags: [patch]

    - name: Display patching results
      ansible.builtin.debug:
        msg: >-
          Packages updated: {{ patch_result.stdout_lines | default([]) | length }} changes applied
          on {{ inventory_hostname }}
      tags: [patch]

    - name: Remove unused packages
      ansible.builtin.apt:
        autoremove: yes
        purge: yes
      tags: [patch]

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      tags: [patch]

    - name: Reboot server if required
      ansible.builtin.reboot:
        msg: "Reboot triggered by Ansible patching"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        reboot_timeout: 300
      when: reboot_required.stat.exists
      tags: [patch, reboot]

    - name: Wait for server to come back online
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 120
      when: reboot_required.stat.exists
      tags: [patch, reboot]

    - name: Verify services after patching
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      loop: "{{ services_to_verify | default([]) }}"
      failed_when: false
      tags: [patch, verify]
