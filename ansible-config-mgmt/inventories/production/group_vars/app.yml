# =============================================================================
# Production — App Server Variables
# =============================================================================
---
app_name: myapp
app_user: myapp
app_group: myapp
app_home: /opt/myapp
app_port: 8080
app_env: production
app_version: latest
app_artifact_url: "https://artifacts.myapp.internal/releases/{{ app_version }}/myapp.tar.gz"

# JVM / Runtime settings (production-tuned)
app_java_opts: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
app_log_dir: /var/log/myapp
app_pid_file: /run/myapp/myapp.pid

# Health check
app_health_check_url: "http://localhost:{{ app_port }}/health"
app_health_check_timeout: 60

# Additional firewall rules for app
app_firewall_rules:
  - { rule: allow, port: "{{ app_port }}", proto: tcp, src: "10.0.1.0/24", comment: "App from Web subnet" }
