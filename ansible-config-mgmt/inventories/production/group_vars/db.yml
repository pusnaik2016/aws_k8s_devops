# =============================================================================
# Production — Database Server Variables
# =============================================================================
---
postgresql_version: "15"
postgresql_port: 5432
postgresql_listen_addresses: "*"
postgresql_max_connections: 300
postgresql_shared_buffers: "2GB"
postgresql_effective_cache_size: "6GB"
postgresql_work_mem: "16MB"
postgresql_maintenance_work_mem: "512MB"
postgresql_wal_level: replica
postgresql_max_wal_senders: 5

# Application database
postgresql_db_name: myapp_production
postgresql_db_user: myapp
postgresql_db_encoding: UTF8
postgresql_db_locale: en_US.UTF-8

# pg_hba — connection rules (subnet-scoped)
postgresql_hba_entries:
  - { type: local, database: all, user: postgres, method: peer }
  - { type: local, database: all, user: all, method: peer }
  - { type: host, database: "{{ postgresql_db_name }}", user: "{{ postgresql_db_user }}", address: "10.0.2.0/24", method: md5 }
  - { type: host, database: all, user: all, address: "127.0.0.1/32", method: md5 }

# Additional firewall rules for DB
db_firewall_rules:
  - { rule: allow, port: "{{ postgresql_port }}", proto: tcp, src: "10.0.2.0/24", comment: "PostgreSQL from App subnet" }
