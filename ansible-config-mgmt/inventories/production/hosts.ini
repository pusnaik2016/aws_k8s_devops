[web]
web-prod-01  ansible_host=10.0.1.10  ansible_user=deploy
web-prod-02  ansible_host=10.0.1.11  ansible_user=deploy

[app]
app-prod-01  ansible_host=10.0.2.10  ansible_user=deploy
app-prod-02  ansible_host=10.0.2.11  ansible_user=deploy

[db]
db-prod-01   ansible_host=10.0.3.10  ansible_user=deploy
db-prod-02   ansible_host=10.0.3.11  ansible_user=deploy  # replica

# --------------- Group Hierarchy ---------------
[linux:children]
web
app
db

[production:children]
web
app
db
