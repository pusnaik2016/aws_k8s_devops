# =============================================================================
# Role: backup — Automated S3 Backup Tasks
# =============================================================================
---
- name: Install AWS CLI
  ansible.builtin.apt:
    name: awscli
    state: present
  when: backup_enabled
  tags: [backup]

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: backup_enabled
  tags: [backup]

- name: Deploy database backup script
  ansible.builtin.template:
    src: backup-db.sh.j2
    dest: /usr/local/bin/backup-db.sh
    owner: root
    group: root
    mode: "0700"
  when: backup_enabled
  tags: [backup]

- name: Deploy backup cron job
  ansible.builtin.cron:
    name: "Database backup to S3"
    minute: "{{ backup_schedule.split(' ')[0] }}"
    hour: "{{ backup_schedule.split(' ')[1] }}"
    day: "{{ backup_schedule.split(' ')[2] }}"
    month: "{{ backup_schedule.split(' ')[3] }}"
    weekday: "{{ backup_schedule.split(' ')[4] }}"
    job: "/usr/local/bin/backup-db.sh >> {{ backup_log_file }} 2>&1"
    user: root
    state: present
  when: backup_enabled
  tags: [backup]

- name: Deploy backup log rotation
  ansible.builtin.template:
    src: backup-cron.j2
    dest: /etc/logrotate.d/backup
    owner: root
    group: root
    mode: "0644"
  when: backup_enabled
  tags: [backup]
