# =============================================================================
# Role: common — Default Variables
# =============================================================================
---
# System packages
common_packages:
  - vim
  - curl
  - wget
  - htop
  - net-tools
  - unzip
  - jq

# NTP
ntp_timezone: UTC
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org

# SSH
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 5
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 3

# UFW
ufw_default_incoming: deny
ufw_default_outgoing: allow
ufw_rules: []

# fail2ban
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5

# Deploy user
deploy_user: deploy
deploy_user_shell: /bin/bash
deploy_user_groups:
  - sudo
