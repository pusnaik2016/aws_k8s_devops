worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens on;                          # SRV001: Version exposed
    autoindex on;                              # SRV006: Directory listing

    access_log off;                            # SRV007: Logging disabled

    ssl_protocols SSLv3 TLSv1 TLSv1.1 TLSv1.2;  # SRV003: Weak protocols

    client_max_body_size 500m;                 # SRV005: Very large upload size

    server {
        listen 80;                             # SRV002: HTTP without HTTPS
        server_name example.com;

        # SRV004: Missing security headers

        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /uploads {
            alias /var/www/uploads;
            autoindex on;                      # SRV006: Directory listing
        }
    }
}
