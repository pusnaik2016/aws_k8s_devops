# Sample K8s deployment with multiple issues — for testing K8s troubleshooter
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  # K8S040: Missing namespace
spec:
  replicas: 1                          # K8S050: Single replica
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      hostNetwork: true                # K8S023: Host network
      hostPID: true                    # K8S024: Host PID
      containers:
      - name: api
        image: myregistry/api:latest   # K8S030: latest tag
        # K8S010: No livenessProbe
        # K8S011: No readinessProbe
        # K8S001/K8S002: No resource requests/limits
        ports:
        - containerPort: 8080
        env:
        - name: DB_PASSWORD
          value: "hardcoded-password-123"
      - name: sidecar
        image: busybox                 # K8S031: No tag
        command: ["sh", "-c", "while true; do echo sidecar; sleep 60; done"]
        securityContext:
          privileged: true             # K8S021: Privileged
          runAsUser: 0                 # K8S020: Running as root
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  # K8S040: Missing namespace
spec:
  type: LoadBalancer
  selector:
    app: api-server
  ports:
  - port: 80
    targetPort: 8080
---
# Good deployment for comparison
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: production
  labels:
    app: web-frontend
    version: v2.1.0
    team: platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        version: v2.1.0
    spec:
      containers:
      - name: web
        image: myregistry/web:v2.1.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
