[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "claude-devops-debug"
version = "1.0.0"
description = "10-in-1 DevOps Automation Toolkit — IaC Generator, Security Scanner, K8s Troubleshooter, Cost Optimizer & more"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Pushparaj Naik"}]

dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-html>=4.0",
]

[project.scripts]
devops-debug = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
