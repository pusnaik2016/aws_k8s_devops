# =============================================================================
# Application CD Pipeline — Deploy to EKS + AKS + GKE
# =============================================================================
# Triggered after CI succeeds on main.
# Deploys Helm chart to:
#   1. EKS (Primary Active) — all 4 services
#   2. AKS (Hot Standby)    — all 4 services (reduced replicas)
#   3. GKE (Compliance)     — audit-pipeline only
#
# Both EKS and AKS are private clusters — kubectl access via
# GitHub Actions self-hosted runners or VPN tunnel.
# =============================================================================

name: Application CD — Deploy to Clusters

on:
  workflow_run:
    workflows: ["Application CI — Build & Push"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  HELM_CHART_PATH: helm/clearing-engine

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Deploy to EKS (Primary Active)
  # ─────────────────────────────────────────────
  deploy-eks:
    name: "🚀 Deploy → EKS (Primary)"
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production-aws
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Helm Dependency Update
        run: helm dependency update ${{ env.HELM_CHART_PATH }}

      - name: Helm Upgrade/Install (EKS)
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::8}"
          helm upgrade --install clearing-engine ${{ env.HELM_CHART_PATH }} \
            --namespace clearing-engine \
            --create-namespace \
            --values ${{ env.HELM_CHART_PATH }}/values.yaml \
            --values ${{ env.HELM_CHART_PATH }}/values-aws.yaml \
            --set global.imageTag="$IMAGE_TAG" \
            --set global.imageRegistry="${{ secrets.ECR_REGISTRY }}" \
            --set global.database.host="${{ secrets.AURORA_WRITER_ENDPOINT }}" \
            --set global.redis.host="${{ secrets.ELASTICACHE_ENDPOINT }}" \
            --timeout 10m \
            --wait \
            --atomic

      - name: Verify Rollout (EKS)
        run: |
          echo "═══════════════════════════════════════════"
          echo "  EKS DEPLOYMENT VERIFICATION"
          echo "═══════════════════════════════════════════"
          for svc in transaction-ingestion clearing-engine-core audit-pipeline notification-service; do
            echo "Verifying: $svc"
            kubectl rollout status deployment/$svc \
              -n clearing-engine --timeout=5m || true
          done
          echo ""
          echo "Pod Status:"
          kubectl get pods -n clearing-engine -o wide
          echo ""
          echo "Services:"
          kubectl get svc -n clearing-engine

      - name: Smoke Test (EKS)
        run: |
          echo "Running health check on transaction-ingestion..."
          kubectl exec -n clearing-engine \
            deploy/transaction-ingestion -- \
            python -c "import httpx; r = httpx.get('http://localhost:8000/health'); print(r.json()); assert r.status_code == 200" || \
            echo "⚠️ Smoke test skipped — pod may still be initializing"

  # ─────────────────────────────────────────────
  # Job 2: Deploy to AKS (Hot Standby)
  # ─────────────────────────────────────────────
  deploy-aks:
    name: "🔄 Deploy → AKS (Standby)"
    needs: deploy-eks
    runs-on: ubuntu-latest
    environment: production-azure
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS kubeconfig
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Helm Dependency Update
        run: helm dependency update ${{ env.HELM_CHART_PATH }}

      - name: Helm Upgrade/Install (AKS)
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::8}"
          helm upgrade --install clearing-engine ${{ env.HELM_CHART_PATH }} \
            --namespace clearing-engine \
            --create-namespace \
            --values ${{ env.HELM_CHART_PATH }}/values.yaml \
            --values ${{ env.HELM_CHART_PATH }}/values-azure.yaml \
            --set global.imageTag="$IMAGE_TAG" \
            --set global.imageRegistry="${{ secrets.ACR_LOGIN_SERVER }}" \
            --set global.database.host="${{ secrets.AZURE_SQL_ENDPOINT }}" \
            --set global.redis.host="${{ secrets.AZURE_REDIS_ENDPOINT }}" \
            --timeout 10m \
            --wait \
            --atomic

      - name: Verify Rollout (AKS)
        run: |
          echo "═══════════════════════════════════════════"
          echo "  AKS DEPLOYMENT VERIFICATION"
          echo "═══════════════════════════════════════════"
          kubectl get pods -n clearing-engine -o wide
          kubectl get svc -n clearing-engine

  # ─────────────────────────────────────────────
  # Job 3: Deploy to GKE (Audit Pipeline Only)
  # ─────────────────────────────────────────────
  deploy-gke:
    name: "📊 Deploy → GKE (Audit)"
    needs: deploy-eks
    runs-on: ubuntu-latest
    environment: production-gcp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure GKE kubeconfig
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: us-central1

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Helm Dependency Update
        run: helm dependency update ${{ env.HELM_CHART_PATH }}

      - name: Helm Upgrade/Install (GKE — Audit Only)
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::8}"
          helm upgrade --install clearing-engine ${{ env.HELM_CHART_PATH }} \
            --namespace clearing-engine \
            --create-namespace \
            --values ${{ env.HELM_CHART_PATH }}/values.yaml \
            --values ${{ env.HELM_CHART_PATH }}/values-gcp.yaml \
            --set global.imageTag="$IMAGE_TAG" \
            --set global.database.host="${{ secrets.ALLOYDB_PRIVATE_IP }}" \
            --timeout 10m \
            --wait \
            --atomic

      - name: Verify Rollout (GKE)
        run: |
          echo "═══════════════════════════════════════════"
          echo "  GKE DEPLOYMENT VERIFICATION (Audit Only)"
          echo "═══════════════════════════════════════════"
          kubectl get pods -n clearing-engine -o wide
          kubectl get svc -n clearing-engine

  # ─────────────────────────────────────────────
  # Job 4: Deployment Summary
  # ─────────────────────────────────────────────
  summary:
    name: "📋 Deployment Summary"
    needs: [deploy-eks, deploy-aks, deploy-gke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Report
        run: |
          echo "═══════════════════════════════════════════"
          echo "  MULTICLOUD DEPLOYMENT REPORT"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "  Image Tag: sha-${GITHUB_SHA::8}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Actor:     ${{ github.actor }}"
          echo "  Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "  ┌──────────┬───────────────────────────────────────┐"
          echo "  │ Cluster  │ Status                                │"
          echo "  ├──────────┼───────────────────────────────────────┤"
          echo "  │ EKS      │ ${{ needs.deploy-eks.result }}        │"
          echo "  │ AKS      │ ${{ needs.deploy-aks.result }}        │"
          echo "  │ GKE      │ ${{ needs.deploy-gke.result }}        │"
          echo "  └──────────┴───────────────────────────────────────┘"
          echo ""
          echo "  Services Deployed:"
          echo "    EKS: transaction-ingestion, clearing-engine-core,"
          echo "         audit-pipeline, notification-service"
          echo "    AKS: transaction-ingestion, clearing-engine-core,"
          echo "         audit-pipeline, notification-service (standby)"
          echo "    GKE: audit-pipeline (compliance analytics only)"
          echo ""
          echo "═══════════════════════════════════════════"
